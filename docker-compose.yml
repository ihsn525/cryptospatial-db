services:
  db:
    image: postgis/postgis:16-3.4
    container_name: cryptospatial_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cryptosecretpassword99
      POSTGRES_DB: cryptospatial_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cryptospatial_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: