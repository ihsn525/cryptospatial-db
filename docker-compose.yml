services:
  db:
    image: postgis/postgis:16-3.4
    container_name: cryptospatial_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cryptosecretpassword99
      POSTGRES_DB: cryptospatial_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cryptospatial_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cryptospatial_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:cryptosecretpassword99@db:5432/cryptospatial_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cryptospatial_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

  fooddash:
    build:
      context: ./fooddash-app
      dockerfile: Dockerfile
    container_name: fooddash_consumer_app
    restart: always
    ports:
      - "5174:5174"
    depends_on:
      - backend

  db-inspector:
    build:
      context: ./db-inspector
      dockerfile: Dockerfile
    container_name: cryptospatial_db_inspector
    restart: always
    ports:
      - "5175:5175"
    depends_on:
      - backend

volumes:
  postgres_data: