name: CryptoSpatial-DB CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Cancel redundant in-flight workflow runs on new pushes to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict default GITHUB_TOKEN permissions (Least-Privilege Security Model)
permissions:
  contents: read

jobs:
  # --- STAGE 1: BACKEND CI ---
  backend-ci:
    name: FastAPI & Database Migration Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: cryptosecretpassword99
          POSTGRES_DB: cryptospatial_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Database Schema Migrations
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: cryptosecretpassword99
          PGDATABASE: cryptospatial_db
        run: |
          psql -f database/migrations/001_initial_schema.sql
          psql -f database/migrations/002_update_procedure.sql

  # --- STAGE 2: FRONTEND CI ---
  frontend-ci:
    name: React Vite Build & Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Frontend Assets
        working-directory: frontend
        run: npm run build